<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mipa - 标签页管理器</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-theme="dark-warm">
    <div class="container">
        <header class="mipa-header">
            <div class="header-top">
                <div class="logo-section">
                    <h1 class="logo">我的收藏</h1>
                    <span id="collection-count" class="collection-count">0 个集合</span>
                </div>
                <div class="top-buttons">
                    <div class="theme-switcher" id="theme-switcher">
                        <button class="theme-switcher-btn" id="theme-btn" title="切换主题">
                            <i class="fas fa-palette"></i>
                            <span>主题</span>
                        </button>
                        <div class="theme-dropdown" id="theme-dropdown">
                            <div class="theme-option active" data-theme="dark-warm">
                                <span class="theme-preview"></span>
                                <span>暗色温暖</span>
                            </div>
                            <div class="theme-option" data-theme="light">
                                <span class="theme-preview"></span>
                                <span>亮色柔和</span>
                            </div>
                            <div class="theme-option" data-theme="light-cool">
                                <span class="theme-preview"></span>
                                <span>亮色清爽</span>
                            </div>
                        </div>
                    </div>
                    <button id="connect-gist" class="btn-primary">连接 Gist</button>
                </div>
            </div>
            <div class="header-bottom">
                <div class="search-section">
                    <div class="search-container">
                        <input type="text" id="collection-search" placeholder="搜索集合或标签页..." class="collection-search-input">
                        <button class="search-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="header-buttons">
                    <button id="toggle-collections" class="btn-primary">展开/收起</button>
                    <button id="add-collection" class="btn-primary">新建集合</button>
                    <button id="export-data" class="btn-primary">导出</button>
                    <button id="import-data" class="btn-primary">导入</button>
                    <input type="file" id="import-file-input" class="hidden" accept=".json">
                </div>
            </div>
        </header>
        <main class="mipa-main">
            <div class="collections-area">
                <div id="add-collection-form" class="add-collection-form hidden">
                    <div class="add-collection-input-group">
                        <input type="text" id="new-collection-name" placeholder="请输入集合名称" class="add-collection-input">
                        <button type="button" id="cancel-add-collection" class="btn-cancel">取消</button>
                        <button type="button" id="save-add-collection" class="btn-primary">保存</button>
                    </div>
                    <div class="color-picker-container">
                        <span class="color-label">颜色</span>
                        <div class="color-options">
                            <input type="radio" id="color-white" name="collection-color" value="white" checked>
                            <label for="color-white" class="color-option color-white"></label>
                            <input type="radio" id="color-gray" name="collection-color" value="gray">
                            <label for="color-gray" class="color-option color-gray"></label>
                            <input type="radio" id="color-red" name="collection-color" value="red">
                            <label for="color-red" class="color-option color-red"></label>
                            <input type="radio" id="color-orange" name="collection-color" value="orange">
                            <label for="color-orange" class="color-option color-orange"></label>
                            <input type="radio" id="color-yellow" name="collection-color" value="yellow">
                            <label for="color-yellow" class="color-option color-yellow"></label>
                            <input type="radio" id="color-green" name="collection-color" value="green">
                            <label for="color-green" class="color-option color-green"></label>
                            <input type="radio" id="color-blue" name="collection-color" value="blue">
                            <label for="color-blue" class="color-option color-blue"></label>
                            <input type="radio" id="color-purple" name="collection-color" value="purple">
                            <label for="color-purple" class="color-option color-purple"></label>
                        </div>
                    </div>
                </div>
                <div id="collections-container"></div>
            </div>
            <div class="sidebar-trigger"></div>
            <aside class="open-tabs-sidebar">
                <div class="sidebar-header">
                    <h3>已打开的标签页</h3>
                </div>
                <div id="windows-container"></div>
            </aside>
        </main>
    </div>
    <div id="edit-tab-modal" class="modal">
        <div class="modal-content edit-tab-modal-content">
            <div class="modal-header">
                <h2 id="edit-tab-title">编辑标签页</h2>
                <span class="close edit-tab-close">&times;</span>
            </div>
            <form id="edit-tab-form">
                <div class="form-group tab-favicon-container">
                    <img id="edit-tab-favicon" class="tab-favicon" src="" alt="网站图标">
                </div>
                <div class="form-group">
                    <label for="edit-title">标题</label>
                    <input type="text" id="edit-title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="edit-description">描述</label>
                    <textarea id="edit-description" name="description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="edit-url">网址</label>
                    <input type="url" id="edit-url" name="url" required>
                </div>
                <div class="form-actions form-actions-split">
                    <button type="button" id="delete-tab-btn" class="btn-delete"><i class="fas fa-times"></i>删除</button>
                    <div class="form-actions-right">
                        <button type="button" id="cancel-edit-btn" class="btn-cancel">取消</button>
                        <button type="submit" class="btn-primary btn-save">完成</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div id="gist-modal" class="modal">
        <div class="modal-content gist-modal-content">
            <div class="modal-header">
                <h2 id="gist-modal-title">连接 GitHub Gist</h2>
                <span class="close gist-modal-close">&times;</span>
            </div>
            <div id="gist-login-form" class="gist-modal-body">
                <div class="form-group">
                    <label for="github-token">GitHub 个人访问令牌</label>
                    <input type="password" id="github-token" name="github-token" placeholder="请输入具有 gist 权限的 GitHub token" required>
                    <div class="token-hint">
                        <p>您需要一个具有 <strong>gist</strong> 权限的 GitHub 个人访问令牌。<a href="https://github.com/settings/tokens/new?scopes=gist" target="_blank">点击此处创建</a></p>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" id="gist-cancel-btn" class="btn-cancel">取消</button>
                    <button type="button" id="gist-connect-btn" class="btn-primary">连接</button>
                </div>
            </div>
            <div id="gist-logout-confirm" class="gist-modal-body hidden">
                <div class="logout-warning">
                    <i class="fa-solid fa-exclamation-circle"></i>
                    <p>确定要从 GitHub Gist 登出吗？</p>
                    <p class="warning-text">您将无法再在设备间同步数据。</p>
                </div>
                <div class="form-actions">
                    <button type="button" id="gist-cancel-logout-btn" class="btn-cancel">取消</button>
                    <button type="button" id="gist-logout-btn" class="btn-delete">登出</button>
                </div>
            </div>
            <div id="gist-error-message" class="gist-modal-body hidden">
                <div class="error-warning">
                    <i class="fa-solid fa-times-circle"></i>
                    <p id="error-message-text"></p>
                </div>
                <div class="form-actions">
                    <button type="button" id="gist-close-error-btn" class="btn-primary">确定</button>
                </div>
            </div>
        </div>
    </div>
    <div id="delete-modal" class="modal">
        <div class="modal-content gist-modal-content">
            <div class="modal-header">
                <h2 id="delete-modal-title">删除集合</h2>
                <span class="close delete-modal-close">&times;</span>
            </div>
            <div id="delete-confirm-body" class="gist-modal-body">
                <div class="logout-warning">
                    <i class="fa-solid fa-exclamation-circle"></i>
                    <p>确定要删除这个集合吗？</p>
                    <p class="warning-text">此操作无法撤销。</p>
                </div>
                <div class="form-actions">
                    <button type="button" id="delete-cancel-btn" class="btn-cancel">取消</button>
                    <button type="button" id="delete-confirm-btn" class="btn-delete">删除</button>
                </div>
            </div>
        </div>
    </div>
    <img id="bg-image" src="img/mipa.jpg">
    <script type="module" src="js/mipa.js"></script>
</body>
</html>
